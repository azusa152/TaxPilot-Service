services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taxpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taxpilot_dev}
      POSTGRES_DB: ${POSTGRES_DB:-taxpilot}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taxpilot}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "alembic upgrade head && uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload"

  dashboard:
    build: ./frontend
    ports:
      - "8501:8501"
    depends_on:
      - api
    volumes:
      - ./frontend:/app
    environment:
      API_BASE_URL: http://api:8000

volumes:
  pgdata:
